<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter App</title>
    <link rel="stylesheet" href="counter.css">
</head>
<body>
    <div id="headcontainer">
        
        <button id="mood">🌞Stay Positive</button>
    </div>
    <div id="content">
        <h1><b>Counter App</b></h1>
        <p>Small steps make big progress</p>
    </div>
    <div id="container">
        <p id="count">0</p>
        <p id="sentence">CURRENT COUNT</p>
    </div>
    <div id="buttons">
        <button id="decrement">-</button>
        <button id="increment">+</button>
        <button id="reset">@</button>
        <p id="decre"></p>
        <p id="incre"></p>
        <p id="set"></p>
    </div>
    <div id="footcontainer">
        <p>Consistency turns small actions into big results.</p>
    </div>
</body>
<script src="counter.js"></script>
</html>
